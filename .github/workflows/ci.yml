name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: python -m experiments.gate0_hidden_linearity
      - run: python -m experiments.gate1_conjugacy
      - run: python -m experiments.gate2_evolutionary_forgetting
      - run: python -m experiments.gate3_strategy_separator
      - run: python -m experiments.gate4_same_answer_different_algorithm
      - run: python -m experiments.gate5_forecast_before_generation
      - run: python -m experiments.gate6_backprop_fast_forward
